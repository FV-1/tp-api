# Contrat de sandboxd — squelette du TP3.
# Une opération est écrite pour exemple (getSandbox). À vous d'écrire les autres :
# voir le sujet du TP, partie 1. Vérifiez avec `make lint` après chaque ajout.
openapi: 3.1.0
info:
  title: sandboxd
  version: 1.0.0
  summary: Des sandboxes éphémères à la demande, pilotées par HTTP.
  description: |
    sandboxd crée, pilote et détruit des sandboxes : des conteneurs Docker
    isolés et jetables, dans lesquels un opérateur ou un agent exécute des
    commandes et lit ou écrit des fichiers.
    Toutes les erreurs suivent la RFC 9457 (application/problem+json).
  contact:
    name: "Binôme : Victor Falc'hun / Lea Debruyne"   # TODO
servers:
  - url: http://localhost:8000
    description: Développement local
tags:
  - name: sandboxes
    description: Cycle de vie des sandboxes
  - name: exec
    description: Exécution de commandes
  - name: files
    description: Lecture et écriture de fichiers
  - name: health
    description: Sondes de santé

paths:
  /v1/sandboxes:
    post:
      tags: [sandboxes]
      operationId: createSandbox
      summary: Créer une sandbox
      description: Accepte la création de façon asynchrone. La sandbox est initialement en état pending.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SandboxCreate"
      responses:
        "202":
          description: Création acceptée.
          headers:
            Location:
              description: URI permettant de consulter la sandbox créée.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sandbox"
        "400":
          $ref: "#/components/responses/BadRequest"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    get:
      tags: [sandboxes]
      operationId: listSandboxes
      summary: Lister les sandboxes
      description: Renvoie une page de sandboxes, éventuellement filtrée par état.
      parameters:
        - name: status
          in: query
          description: Filtrer les sandboxes par état.
          schema:
            $ref: "#/components/schemas/SandboxStatus"
        - name: page_size
          in: query
          description: Nombre maximal de sandboxes dans la page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: page_token
          in: query
          description: Jeton reçu dans next_page_token pour obtenir la page suivante.
          schema:
            type: string
      responses:
        "200":
          description: Page de sandboxes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxList"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/sandboxes/{sandbox_id}:
    parameters:
      - $ref: "#/components/parameters/SandboxId"
    get:
      tags: [sandboxes]
      operationId: getSandbox
      summary: Consulter une sandbox
      description: Renvoie l'état courant de la sandbox.
      responses:
        "200":
          description: La sandbox.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sandbox"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [sandboxes]
      operationId: updateSandbox
      summary: Prolonger la durée de vie d'une sandbox
      description: Met à jour la durée de vie avec JSON Merge Patch.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/SandboxPatch"
      responses:
        "200":
          description: Sandbox mise à jour.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sandbox"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags: [sandboxes]
      operationId: deleteSandbox
      summary: Détruire une sandbox
      description: Supprime la sandbox et son conteneur associé.
      responses:
        "204":
          description: Sandbox détruite.
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/sandboxes/{sandbox_id}/exec:
    parameters:
      - $ref: "#/components/parameters/SandboxId"
    post:
      tags: [exec]
      operationId: execCommand
      summary: Exécuter une commande dans la sandbox
      description: |
        Exécute une commande dans `/workspace`, attend sa fin et renvoie sa sortie.

        La commande est une **liste d'arguments** passée telle quelle au conteneur,
        sans shell : `|`, `>`, `*` ou `$VAR` ne sont pas interprétés. Pour un shell,
        il faut le demander explicitement : `["sh", "-c", "ls | wc -l"]`.

        Une commande qui échoue (code de sortie non nul) ou qui dépasse son délai
        renvoie quand même **200** : l'exécution a eu lieu, et le résultat le dit
        (`exit_code`, `timed_out`). Les codes d'erreur HTTP sont réservés aux cas
        où rien n'a pu être exécuté. La sandbox doit être `ready`, sinon 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecRequest"
            examples:
              python:
                summary: Lancer un script Python en ligne
                value: {cmd: [python, -c, "print(1)"], timeout_seconds: 10}
              shell:
                summary: Passer par un shell, explicitement
                value: {cmd: [sh, -c, "ls | wc -l"]}
      responses:
        "200":
          description: |
            La commande s'est terminée, quel que soit son code de sortie,
            ou a été tuée à l'expiration de son délai.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecResult"
              examples:
                success:
                  summary: Commande réussie
                  value:
                    exit_code: 0
                    stdout: "data.csv\nmain.py\n"
                    stderr: ""
                    duration_ms: 42
                    timed_out: false
                    truncated: false
                failure:
                  summary: Commande en échec (code de sortie non nul)
                  value:
                    exit_code: 1
                    stdout: ""
                    stderr: "Traceback (most recent call last):\n  ...\nZeroDivisionError: division by zero\n"
                    duration_ms: 87
                    timed_out: false
                    truncated: false
                timeout:
                  summary: Commande tuée à l'expiration du délai
                  value:
                    exit_code: null
                    stdout: "début du calcul\n"
                    stderr: ""
                    duration_ms: 10004
                    timed_out: true
                    truncated: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/sandboxes/{sandbox_id}/files:
    parameters:
      - $ref: "#/components/parameters/SandboxId"
      - $ref: "#/components/parameters/FilePath"
    get:
      tags: [files]
      operationId: readFile
      summary: Lire un fichier de /workspace
      description: |
        Renvoie le contenu brut du fichier, octet pour octet.
        Chemin absent : 404. Chemin qui désigne un dossier : 409.
        Chemin absolu ou contenant `..` : 422. La sandbox doit être `ready`, sinon 409.
      responses:
        "200":
          description: Le contenu du fichier.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
              example: "print(1)\n"
        "404":
          $ref: "#/components/responses/FileNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    put:
      tags: [files]
      operationId: writeFile
      summary: Écrire un fichier dans /workspace
      description: |
        Crée le fichier, ou le remplace entièrement s'il existe. Les dossiers
        intermédiaires sont créés. Le corps est le contenu brut (1 Mio au plus) ;
        un corps vide crée un fichier vide.
        Chemin qui désigne un dossier : 409. Chemin absolu ou contenant `..` : 422.
        La sandbox doit être `ready`, sinon 409.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
            example: "print(1)\n"
      responses:
        "201":
          description: "Le fichier n'existait pas : il a été créé."
        "204":
          description: "Le fichier existait : il a été remplacé."
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /healthz:
    get:
      tags: [health]
      operationId: getHealth
      summary: Le processus est-il vivant ?
      description: Ne vérifie aucune dépendance.
      responses:
        "200":
          description: Vivant.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, enum: [ok]}

components:
  parameters:
    FilePath:
      name: path
      in: query
      required: true
      description: |
        Chemin du fichier, **relatif à `/workspace`**. Refusé (422) s'il est
        absolu (commence par `/`) ou s'il contient un segment `..`.
      schema:
        type: string
        minLength: 1
        maxLength: 4096
        pattern: '^(?!/)(?!(.*/)?\.\.(/|$)).+$'
      example: src/main.py
    SandboxId:
      name: sandbox_id
      in: path
      required: true
      description: Identifiant de la sandbox.
      schema:
        type: string
        pattern: "^sbx-[a-z0-9]{8}$"
      example: sbx-a1b2c3d4

  schemas:
    SandboxStatus:
      type: string
      enum: [pending, ready, failed, terminated]
    Image:
      type: string
      description: Images autorisées (liste blanche).
      enum: [python:3.12-slim, node:22-slim, alpine:3.20]
    Limits:
      type: object
      additionalProperties: false
      properties:
        cpus:
          type: number
          minimum: 0.1
          maximum: 2
          default: 1
        memory_mb:
          type: integer
          minimum: 64
          maximum: 1024
          default: 512
    Sandbox:
      type: object
      required: [id, image, status, ttl_seconds, limits, created_at, expires_at]
      properties:
        id:
          type: string
          pattern: "^sbx-[a-z0-9]{8}$"
        image:
          $ref: "#/components/schemas/Image"
        status:
          $ref: "#/components/schemas/SandboxStatus"
        ttl_seconds:
          type: integer
        limits:
          $ref: "#/components/schemas/Limits"
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    SandboxCreate:
      type: object
      additionalProperties: false
      required: [image]
      properties:
        image:
          $ref: "#/components/schemas/Image"
        ttl_seconds:
          type: integer
          minimum: 60
          maximum: 3600
          default: 600
        limits:
          $ref: "#/components/schemas/Limits"
    SandboxPatch:
      type: object
      additionalProperties: false
      required: [ttl_seconds]
      properties:
        ttl_seconds:
          type: integer
          minimum: 60
          maximum: 3600
    SandboxList:
      type: object
      required: [sandboxes]
      properties:
        sandboxes:
          type: array
          items:
            $ref: "#/components/schemas/Sandbox"
        next_page_token:
          type: string
    # TODO : ExecRequest, ExecResult
    Problem:
      type: object
      description: RFC 9457, Problem Details for HTTP APIs.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
    ExecRequest:
      type: object
      additionalProperties: false
      required: [cmd]
      properties:
        cmd:
          type: array
          description: |
            La commande et ses arguments, sans shell. Le premier élément est
            l'exécutable. Aucun élément ne peut être vide.
          minItems: 1
          maxItems: 256
          items:
            type: string
            minLength: 1
            maxLength: 4096
          example: [python, -c, "print(1)"]
        timeout_seconds:
          type: integer
          description: Délai au-delà duquel la commande est tuée (SIGKILL).
          minimum: 1
          maximum: 60
          default: 10
          example: 10
    ExecResult:
      type: object
      required: [exit_code, stdout, stderr, duration_ms, timed_out, truncated]
      properties:
        exit_code:
          type: [integer, "null"]
          description: |
            Code de sortie de la commande (127 : exécutable introuvable).
            `null` si la commande a été tuée à l'expiration du délai.
          minimum: 0
          maximum: 255
          example: 0
        stdout:
          type: string
          description: |
            Sortie standard, décodée en UTF-8 (octets invalides remplacés
            par U+FFFD), coupée à 1 Mio.
          example: "data.csv\nmain.py\n"
        stderr:
          type: string
          description: Sortie d'erreur, mêmes règles que `stdout`.
          example: ""
        duration_ms:
          type: integer
          description: Durée totale de l'exécution, en millisecondes.
          minimum: 0
          example: 42
        timed_out:
          type: boolean
          description: Vrai si la commande a été tuée à l'expiration de `timeout_seconds`.
          example: false
        truncated:
          type: boolean
          description: Vrai si `stdout` ou `stderr` dépassait 1 Mio et a été coupé.
          example: false

  responses:
    BadRequest:
      description: Requête mal formée (JSON illisible) ou paramètres de pagination invalides.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
          example:
            type: /errors/invalid-json
            title: Bad Request
            status: 400
            detail: le corps n'est pas du JSON valide
            instance: /v1/sandboxes/sbx-a1b2c3d4/exec
    FileNotFound:
      description: Sandbox introuvable, ou aucun fichier à ce chemin.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
          examples:
            file:
              summary: Fichier absent
              value:
                type: /errors/file-not-found
                title: Not Found
                status: 404
                detail: src/main.py n'existe pas dans /workspace
                instance: /v1/sandboxes/sbx-a1b2c3d4/files
            sandbox:
              summary: Sandbox absente
              value:
                type: /errors/not-found
                title: Not Found
                status: 404
                detail: sbx-a1b2c3d4 n'existe pas
                instance: /v1/sandboxes/sbx-a1b2c3d4/files
    Conflict:
      description: |
        Opération incompatible avec l'état courant de la sandbox : pas encore
        prête (ou en échec, ou terminée), chemin qui désigne un dossier.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
          examples:
            not_ready:
              summary: Sandbox pas prête
              value:
                type: /errors/not-ready
                title: Conflict
                status: 409
                detail: sbx-a1b2c3d4 est pending, attendez qu'elle soit ready
                instance: /v1/sandboxes/sbx-a1b2c3d4/exec
            is_a_directory:
              summary: Le chemin est un dossier
              value:
                type: /errors/is-a-directory
                title: Conflict
                status: 409
                detail: src est un dossier
                instance: /v1/sandboxes/sbx-a1b2c3d4/files
    PayloadTooLarge:
      description: Corps trop volumineux (1 Mio au plus).
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
          example:
            type: /errors/payload-too-large
            title: Payload Too Large
            status: 413
            detail: le fichier dépasse 1 Mio
            instance: /v1/sandboxes/sbx-a1b2c3d4/files
    UnsupportedMediaType:
      description: Content-Type non accepté par l'opération.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
          example:
            type: /errors/unsupported-media-type
            title: Unsupported Media Type
            status: 415
            detail: "attendu : application/json"
            instance: /v1/sandboxes/sbx-a1b2c3d4/exec
    ValidationFailed:
      description: |
        Corps ou paramètres hors du contrat : champ manquant, image interdite,
        valeur hors bornes, chemin refusé.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
          examples:
            image:
              summary: Image hors liste blanche
              value:
                type: /errors/validation
                title: Unprocessable Content
                status: 422
                detail: "image : ubuntu n'est pas autorisée"
                instance: /v1/sandboxes
            body:
              summary: Corps invalide
              value:
                type: /errors/validation
                title: Unprocessable Content
                status: 422
                detail: "timeout_seconds : doit être entre 1 et 60"
                instance: /v1/sandboxes/sbx-a1b2c3d4/exec
            path:
              summary: Chemin de fichier refusé
              value:
                type: /errors/validation
                title: Unprocessable Content
                status: 422
                detail: "path : ../etc/passwd sort de /workspace"
                instance: /v1/sandboxes/sbx-a1b2c3d4/files
    ServiceUnavailable:
      description: Le démon Docker ne répond pas ; réessayer plus tard.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
          example:
            type: /errors/docker-unavailable
            title: Service Unavailable
            status: 503
            detail: le démon Docker ne répond pas
            instance: /v1/sandboxes/sbx-a1b2c3d4/exec
    NotFound:
      description: Sandbox introuvable.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
